name: Build MediStock AI Android APK

on:
  workflow_dispatch:
    inputs:
      deployed_url:
        description: 'Public HTTPS URL (enables Gemini AI bill scanning & cloud sync inside APK; leave blank for offline bundle)'
        required: false
        default: 'https://medistock-app.ai.studio'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Configure Capacitor Android project
        env:
          DEPLOYED_URL: ${{ github.event.inputs.deployed_url }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const url = (process.env.DEPLOYED_URL || '').trim().replace(/\/$/, '');
          if (url) {
            const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            cfg.server = { url, cleartext: false };
            fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
          }
          EOF
          npm install --no-save --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android

      - name: Apply MediStock AI launcher icons
        run: |
          mkdir -p resources
          cp public/pwa-512x512.png resources/icon-only.png
          cp public/pwa-maskable-512x512.png resources/icon-foreground.png
          node << 'EOF'
          const fs = require('fs');
          const zlib = require('zlib');
          // Generate a valid 512x512 solid #0F766E PNG for Android adaptive icon background
          const width = 512, height = 512;
          const raw = Buffer.alloc((width * 4 + 1) * height);
          for (let y = 0; y < height; y++) {
            const rowStart = y * (width * 4 + 1);
            raw[rowStart] = 0;
            for (let x = 0; x < width; x++) {
              const p = rowStart + 1 + x * 4;
              raw[p] = 0x0f;
              raw[p + 1] = 0x76;
              raw[p + 2] = 0x6e;
              raw[p + 3] = 0xff;
            }
          }
          function crc32(buf) {
            let c = 0xffffffff;
            for (let i = 0; i < buf.length; i++) {
              c ^= buf[i];
              for (let k = 0; k < 8; k++) c = (c >>> 1) ^ (c & 1 ? 0xedb88320 : 0);
            }
            return (c ^ 0xffffffff) >>> 0;
          }
          function chunk(type, data) {
            const len = Buffer.alloc(4);
            len.writeUInt32BE(data.length, 0);
            const t = Buffer.from(type, 'ascii');
            const crc = Buffer.alloc(4);
            crc.writeUInt32BE(crc32(Buffer.concat([t, data])), 0);
            return Buffer.concat([len, t, data, crc]);
          }
          const ihdr = Buffer.alloc(13);
          ihdr.writeUInt32BE(width, 0);
          ihdr.writeUInt32BE(height, 4);
          ihdr[8] = 8; ihdr[9] = 6; ihdr[10] = 0; ihdr[11] = 0; ihdr[12] = 0;
          const png = Buffer.concat([
            Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]),
            chunk('IHDR', ihdr),
            chunk('IDAT', zlib.deflateSync(raw)),
            chunk('IEND', Buffer.alloc(0)),
          ]);
          fs.writeFileSync('resources/icon-background.png', png);
          EOF
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0F766E' --splashBackgroundColor '#0F766E'
          node << 'EOF'
          const fs = require('fs');
          const bgPng = 'android/app/src/main/res/mipmap-mdpi/ic_launcher_background.png';
          if (!fs.existsSync(bgPng)) {
            fs.mkdirSync('android/app/src/main/res/values', { recursive: true });
            fs.writeFileSync(
              'android/app/src/main/res/values/ic_launcher_background.xml',
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0F766E</color>\n</resources>\n'
            );
            for (const f of [
              'android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml',
              'android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml',
            ]) {
              if (fs.existsSync(f)) {
                const xml = fs.readFileSync(f, 'utf8').replace(/@mipmap\/ic_launcher_background/g, '@color/ic_launcher_background');
                fs.writeFileSync(f, xml);
              }
            }
          }
          EOF

      - name: Sync web assets, permissions, and Android 15/16 edge-to-edge safe-area support
        run: |
          npx cap sync android
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');

          // 1. Add camera/audio permissions and keyboard adjustResize to AndroidManifest.xml
          const manifestPath = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(manifestPath, 'utf8');
          const perms = [
            '    <uses-permission android:name="android.permission.CAMERA" />',
            '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
            '    <uses-feature android:name="android.hardware.camera" android:required="false" />',
          ];
          const anchor = '<uses-permission android:name="android.permission.INTERNET" />';
          for (const perm of perms) {
            if (!xml.includes(perm.trim()) && xml.includes(anchor)) {
              xml = xml.replace(anchor, `${anchor}\n${perm}`);
            }
          }
          if (!xml.includes('android:windowSoftInputMode')) {
            xml = xml.replace(
              '<activity',
              '<activity\n            android:windowSoftInputMode="adjustResize"'
            );
          }
          fs.writeFileSync(manifestPath, xml);

          // 2. Patch MainActivity.java to enforce exact Android 15/16 WindowInsets (status bar + display cutout / Atomic Island + gesture bar + IME keyboard)
          const mainActivityPath = path.join(
            'android',
            'app',
            'src',
            'main',
            'java',
            'in',
            'medistock',
            'ai',
            'pharmacy',
            'MainActivity.java'
          );
          const mainActivityJava = `package in.medistock.ai.pharmacy;

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private View rootContentView;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }

                  getWindow().setStatusBarColor(Color.TRANSPARENT);
                  getWindow().setNavigationBarColor(Color.TRANSPARENT);

                  rootContentView = findViewById(android.R.id.content);
                  applySystemBarTheme(false);

                  if (rootContentView != null) {
                      ViewCompat.setOnApplyWindowInsetsListener(rootContentView, (view, windowInsets) -> {
                          Insets bars = windowInsets.getInsets(
                              WindowInsetsCompat.Type.systemBars()
                                  | WindowInsetsCompat.Type.displayCutout()
                                  | WindowInsetsCompat.Type.ime()
                          );
                          view.setPadding(bars.left, bars.top, bars.right, bars.bottom);
                          return WindowInsetsCompat.CONSUMED;
                      });
                      ViewCompat.requestApplyInsets(rootContentView);
                  }

                  if (getBridge() != null && getBridge().getWebView() != null) {
                      WebView webView = getBridge().getWebView();
                      WebSettings settings = webView.getSettings();
                      String ua = settings.getUserAgentString();
                      if (ua != null && !ua.contains("MediStockNativeInsets")) {
                          settings.setUserAgentString(ua + " MediStockNativeInsets/1");
                      }
                      webView.addJavascriptInterface(new MediStockThemeBridge(), "MediStockAndroid");
                  }
              }

              private void applySystemBarTheme(boolean isDark) {
                  int bgColor = Color.parseColor(isDark ? "#101A1D" : "#FFFFFF");
                  if (rootContentView != null) {
                      rootContentView.setBackgroundColor(bgColor);
                  }
                  WindowInsetsControllerCompat controller =
                      WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (controller != null) {
                      controller.setAppearanceLightStatusBars(!isDark);
                      controller.setAppearanceLightNavigationBars(!isDark);
                  }
              }

              private class MediStockThemeBridge {
                  @JavascriptInterface
                  public void setDarkMode(final boolean isDark) {
                      runOnUiThread(() -> applySystemBarTheme(isDark));
                  }
              }
          }
          `.replace(/^          /gm, '');

          fs.mkdirSync(path.dirname(mainActivityPath), { recursive: true });
          fs.writeFileSync(mainActivityPath, mainActivityJava);
          console.log('Patched MainActivity.java with native Android 15/16 WindowInsetsCompat support.');
          EOF

      - name: Accept Android SDK licenses & compile APK
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../MediStock-AI.apk

      - name: Upload MediStock-AI.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediStock-AI-Android-APK
          path: MediStock-AI.apk
          if-no-files-found: error
