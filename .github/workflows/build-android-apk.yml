name: Build MediStock AI Android APK

on:
  workflow_dispatch:
    inputs:
      deployed_url:
        description: 'Optional: Public Cloud Run HTTPS URL (enables Gemini AI bill scanning & cloud sync inside APK)'
        required: false
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        run: |
          npm install
          npm run build

      - name: Configure Capacitor Android project
        env:
          DEPLOYED_URL: ${{ github.event.inputs.deployed_url }}
        run: |
          if [ -n "$DEPLOYED_URL" ]; then
            node -e "
              const fs = require('fs');
              const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
              cfg.server = { url: process.env.DEPLOYED_URL.replace(/\/$/, ''), cleartext: false };
              fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
            "
          fi
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Add Android camera & microphone permissions for bill scanner
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          node -e "
            const fs = require('fs');
            let xml = fs.readFileSync('$MANIFEST', 'utf8');
            const perms = [
              '    <uses-permission android:name=\"android.permission.CAMERA\" />',
              '    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />',
              '    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />'
            ];
            for (const p of perms) {
              if (!xml.includes(p.trim())) {
                xml = xml.replace('<uses-permission android:name=\"android.permission.INTERNET\" />',
                  '<uses-permission android:name=\"android.permission.INTERNET\" />\n' + p);
              }
            }
            fs.writeFileSync('$MANIFEST', xml);
          "

      - name: Compile Android APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload MediStock-AI.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediStock-AI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
